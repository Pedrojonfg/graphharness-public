openapi: 3.1.0
info:
  title: Hub API
  version: 1.0.0
  description: "REST API of the Hub for the PWA. No authentication: only reachable
    from the tailnet."
servers:
  - url: /api/v1
components:
  schemas: {}
  parameters: {}
paths:
  /subjects:
    get:
      summary: Subjects (including archived ones)
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 200
                    name:
                      type: string
                    slug:
                      type: string
                    kind:
                      type: string
                      enum:
                        - computable_math
                        - general
                        - programming
                    courseNotation:
                      type:
                        - string
                        - "null"
                    lhSourceFolder:
                      type:
                        - string
                        - "null"
                    createdAt:
                      type: string
                      format: date-time
                    archivedAt:
                      type:
                        - string
                        - "null"
                      format: date-time
                  required:
                    - id
                    - name
                    - slug
                    - kind
                    - courseNotation
                    - lhSourceFolder
                    - createdAt
                    - archivedAt
    post:
      summary: Create subject
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                kind:
                  type: string
                  enum:
                    - computable_math
                    - general
                    - programming
                  default: general
                courseNotation:
                  type: string
                  maxLength: 5000
                lhSourceFolder:
                  type: string
                  maxLength: 500
              required:
                - name
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 200
                  name:
                    type: string
                  slug:
                    type: string
                  kind:
                    type: string
                    enum:
                      - computable_math
                      - general
                      - programming
                  courseNotation:
                    type:
                      - string
                      - "null"
                  lhSourceFolder:
                    type:
                      - string
                      - "null"
                  createdAt:
                    type: string
                    format: date-time
                  archivedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                required:
                  - id
                  - name
                  - slug
                  - kind
                  - courseNotation
                  - lhSourceFolder
                  - createdAt
                  - archivedAt
        "400":
          description: invalid_request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: number
                        message:
                          type: string
                      required:
                        - path
                        - message
                required:
                  - error
                  - issues
        "409":
          description: slug_taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    minLength: 1
                  message:
                    type: string
                required:
                  - error
  /subjects/{id}:
    patch:
      summary: Edit or archive subject
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                kind:
                  type: string
                  enum:
                    - computable_math
                    - general
                    - programming
                courseNotation:
                  type:
                    - string
                    - "null"
                  maxLength: 5000
                lhSourceFolder:
                  type:
                    - string
                    - "null"
                  maxLength: 500
                archived:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 200
                  name:
                    type: string
                  slug:
                    type: string
                  kind:
                    type: string
                    enum:
                      - computable_math
                      - general
                      - programming
                  courseNotation:
                    type:
                      - string
                      - "null"
                  lhSourceFolder:
                    type:
                      - string
                      - "null"
                  createdAt:
                    type: string
                    format: date-time
                  archivedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                required:
                  - id
                  - name
                  - slug
                  - kind
                  - courseNotation
                  - lhSourceFolder
                  - createdAt
                  - archivedAt
        "400":
          description: invalid_request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: number
                        message:
                          type: string
                      required:
                        - path
                        - message
                required:
                  - error
                  - issues
        "404":
          description: not_found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - not_found
                required:
                  - error
        "409":
          description: slug_taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    minLength: 1
                  message:
                    type: string
                required:
                  - error
  /subjects/{id}/map:
    get:
      summary: Concepts + edges + effective states (Map)
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Map
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 200
                      name:
                        type: string
                      slug:
                        type: string
                      kind:
                        type: string
                        enum:
                          - computable_math
                          - general
                          - programming
                      courseNotation:
                        type:
                          - string
                          - "null"
                      lhSourceFolder:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                        format: date-time
                      archivedAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                    required:
                      - id
                      - name
                      - slug
                      - kind
                      - courseNotation
                      - lhSourceFolder
                      - createdAt
                      - archivedAt
                  concepts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 200
                        name:
                          type: string
                        description:
                          type: string
                        computable:
                          type: boolean
                        optional:
                          type: boolean
                        state:
                          type: string
                          enum:
                            - solid
                            - review
                            - weak
                            - unknown
                        probability:
                          type:
                            - number
                            - "null"
                          minimum: 0
                          maximum: 1
                        stale:
                          type: boolean
                        manualConfirmation:
                          type:
                            - string
                            - "null"
                          enum:
                            - pending
                            - confirmed
                        templateCount:
                          type: integer
                          minimum: 0
                        propositionCount:
                          type: integer
                          minimum: 0
                      required:
                        - id
                        - name
                        - description
                        - computable
                        - optional
                        - state
                        - probability
                        - stale
                        - manualConfirmation
                        - templateCount
                        - propositionCount
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          minLength: 1
                          maxLength: 200
                        to:
                          type: string
                          minLength: 1
                          maxLength: 200
                        relation:
                          type: string
                          enum:
                            - requires
                            - illustrates
                        confidence:
                          type: string
                          enum:
                            - high
                            - medium
                            - low
                        chainSupport:
                          type: integer
                          minimum: 0
                        source:
                          type: string
                          enum:
                            - derived
                            - curator
                            - manual
                        justification:
                          type:
                            - string
                            - "null"
                      required:
                        - from
                        - to
                        - relation
                        - confidence
                        - chainSupport
                        - source
                        - justification
                required:
                  - subject
                  - concepts
                  - edges
        "404":
          description: not_found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - not_found
                required:
                  - error
  /subjects/{id}/overview:
    get:
      summary: Subject overview (parity with MCP get_subject_overview)
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 200
                      name:
                        type: string
                      slug:
                        type: string
                      kind:
                        type: string
                        enum:
                          - computable_math
                          - general
                          - programming
                      courseNotation:
                        type:
                          - string
                          - "null"
                      lhSourceFolder:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                        format: date-time
                      archivedAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                    required:
                      - id
                      - name
                      - slug
                      - kind
                      - courseNotation
                      - lhSourceFolder
                      - createdAt
                      - archivedAt
                  conceptsByState:
                    type: object
                    properties:
                      solid:
                        type: array
                        items:
                          type: object
                          properties:
                            conceptId:
                              type: string
                              minLength: 1
                              maxLength: 200
                            name:
                              type: string
                            probability:
                              type:
                                - number
                                - "null"
                              minimum: 0
                              maximum: 1
                            stale:
                              type: boolean
                            manualConfirmation:
                              type:
                                - string
                                - "null"
                              enum:
                                - pending
                                - confirmed
                          required:
                            - conceptId
                            - name
                            - probability
                            - stale
                            - manualConfirmation
                      review:
                        type: array
                        items:
                          type: object
                          properties:
                            conceptId:
                              type: string
                              minLength: 1
                              maxLength: 200
                            name:
                              type: string
                            probability:
                              type:
                                - number
                                - "null"
                              minimum: 0
                              maximum: 1
                            stale:
                              type: boolean
                            manualConfirmation:
                              type:
                                - string
                                - "null"
                              enum:
                                - pending
                                - confirmed
                          required:
                            - conceptId
                            - name
                            - probability
                            - stale
                            - manualConfirmation
                      weak:
                        type: array
                        items:
                          type: object
                          properties:
                            conceptId:
                              type: string
                              minLength: 1
                              maxLength: 200
                            name:
                              type: string
                            probability:
                              type:
                                - number
                                - "null"
                              minimum: 0
                              maximum: 1
                            stale:
                              type: boolean
                            manualConfirmation:
                              type:
                                - string
                                - "null"
                              enum:
                                - pending
                                - confirmed
                          required:
                            - conceptId
                            - name
                            - probability
                            - stale
                            - manualConfirmation
                      unknown:
                        type: array
                        items:
                          type: object
                          properties:
                            conceptId:
                              type: string
                              minLength: 1
                              maxLength: 200
                            name:
                              type: string
                            probability:
                              type:
                                - number
                                - "null"
                              minimum: 0
                              maximum: 1
                            stale:
                              type: boolean
                            manualConfirmation:
                              type:
                                - string
                                - "null"
                              enum:
                                - pending
                                - confirmed
                          required:
                            - conceptId
                            - name
                            - probability
                            - stale
                            - manualConfirmation
                    required:
                      - solid
                      - review
                      - weak
                      - unknown
                  exams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 200
                        subjectId:
                          type: string
                          minLength: 1
                          maxLength: 200
                        subjectName:
                          type: string
                        title:
                          type: string
                        date:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                        scopeConceptIds:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 200
                        notes:
                          type:
                            - string
                            - "null"
                        createdAt:
                          type: string
                          format: date-time
                        daysLeft:
                          type: integer
                        preparedProbability:
                          type:
                            - number
                            - "null"
                          minimum: 0
                          maximum: 1
                        unknownCount:
                          type: integer
                          minimum: 0
                      required:
                        - id
                        - subjectId
                        - subjectName
                        - title
                        - date
                        - scopeConceptIds
                        - notes
                        - createdAt
                        - daysLeft
                        - preparedProbability
                        - unknownCount
                  recurringErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        templateId:
                          type: string
                          minLength: 1
                          maxLength: 200
                        template:
                          type: string
                        errorKey:
                          type: string
                        error:
                          type: string
                        timesSeen:
                          type: integer
                          minimum: 1
                      required:
                        - templateId
                        - template
                        - errorKey
                        - error
                        - timesSeen
                required:
                  - subject
                  - conceptsByState
                  - exams
                  - recurringErrors
        "404":
          description: not_found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - not_found
                required:
                  - error
  /knowledge/search:
    post:
      summary: FTS search of concepts and propositions (parity with MCP
        search_knowledge)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                subjectId:
                  type: string
                  minLength: 1
                  maxLength: 200
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
              required:
                - query
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  concepts:
                    type: array
                    items:
                      type: object
                      properties:
                        conceptId:
                          type: string
                          minLength: 1
                          maxLength: 200
                        name:
                          type: string
                        description:
                          type: string
                        subject:
                          type:
                            - string
                            - "null"
                        state:
                          type: string
                          enum:
                            - solid
                            - review
                            - weak
                            - unknown
                      required:
                        - conceptId
                        - name
                        - description
                        - subject
                        - state
                  propositions:
                    type: array
                    items:
                      type: object
                      properties:
                        propositionId:
                          type: string
                          minLength: 1
                          maxLength: 200
                        name:
                          type: string
                        statement:
                          type: string
                        conceptId:
                          type:
                            - string
                            - "null"
                          minLength: 1
                          maxLength: 200
                        conceptName:
                          type:
                            - string
                            - "null"
                      required:
                        - propositionId
                        - name
                        - statement
                        - conceptId
                        - conceptName
                required:
                  - concepts
                  - propositions
        "400":
          description: invalid_request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: number
                        message:
                          type: string
                      required:
                        - path
                        - message
                required:
                  - error
                  - issues
  /knowledge/resolve:
    post:
      summary: Resolve text to candidate concepts (parity with MCP resolve_concepts)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                subjectId:
                  type: string
                  minLength: 1
                  maxLength: 200
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 8
              required:
                - text
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        conceptId:
                          type: string
                          minLength: 1
                          maxLength: 200
                        name:
                          type: string
                        subject:
                          type:
                            - string
                            - "null"
                        score:
                          type: number
                          minimum: 0
                          maximum: 1
                        state:
                          type: string
                          enum:
                            - solid
                            - review
                            - weak
                            - unknown
                      required:
                        - conceptId
                        - name
                        - subject
                        - score
                        - state
                required:
                  - candidates
        "400":
          description: invalid_request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            anyOf:
                              - type: string
                              - type: number
                        message:
                          type: string
                      required:
                        - path
                        - message
                required:
                  - error
                  - issues
        "502":
          description: llm_unavailable | llm_bad_output
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - lh_unavailable
                      - eval_unavailable
                      - llm_unavailable
                      - llm_bad_output
                  message:
                    type: string
                required:
                  - error
  /concepts/{id}:
    get:
      summary: "Detail: propositions, templates, state, recent events, notes, errors"
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 200
                  subjectId:
                    type:
                      - string
                      - "null"
                    minLength: 1
                    maxLength: 200
                  subjectName:
                    type:
                      - string
                      - "null"
                  name:
                    type: string
                  description:
                    type: string
                  computable:
                    type: boolean
                  optional:
                    type: boolean
                  status:
                    type: string
                    enum:
                      - active
                      - merged
                      - retired
                  mergedInto:
                    type:
                      - string
                      - "null"
                    minLength: 1
                    maxLength: 200
                  createdBy:
                    type: string
                    enum:
                      - curator
                      - agent
                      - pwa
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  state:
                    type: object
                    properties:
                      conceptId:
                        type: string
                        minLength: 1
                        maxLength: 200
                      state:
                        type: string
                        enum:
                          - solid
                          - review
                          - weak
                          - unknown
                      probability:
                        type:
                          - number
                          - "null"
                        minimum: 0
                        maximum: 1
                      stale:
                        type: boolean
                      manualConfirmation:
                        type:
                          - string
                          - "null"
                        enum:
                          - pending
                          - confirmed
                      lastEvidenceAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                    required:
                      - conceptId
                      - state
                      - probability
                      - stale
                      - manualConfirmation
                      - lastEvidenceAt
                  propositions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 200
                        name:
                          type: string
                        statement:
                          type: string
                        aliases:
                          type: array
                          items:
                            type: string
                      required:
                        - id
                        - name
                        - statement
                        - aliases
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 200
                        slug:
                          type: string
                        name:
                          type: string
                        level:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - failed
                            - retired
                        methodSummary:
                          type:
                            - string
                            - "null"
                        methodLimits:
                          type:
                            - string
                            - "null"
                        generalTemplateId:
                          type:
                            - string
                            - "null"
                          minLength: 1
                          maxLength: 200
                      required:
                        - id
                        - slug
                        - name
                        - level
                        - status
                        - methodSummary
                        - methodLimits
                        - generalTemplateId
                  recentEvidence:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 200
                        at:
                          type: string
                          format: date-time
                        source:
                          type: string
                          enum:
                            - lh_quiz
                            - lh_probe
                            - lh_recall
                            - lh_practice
                            - hub_exercise
                            - hub_diagnostic
                            - flashcard
                            - declaration
                            - confirmation
                        correct:
                          type:
                            - boolean
                            - "null"
                        responseFormat:
                          type:
                            - string
                            - "null"
                          enum:
                            - open
                            - mcq
                        inferred:
                          type: boolean
                        weight:
                          type: number
                          minimum: 0
                        confidence:
                          type:
                            - integer
                            - "null"
                          minimum: 0
                          maximum: 100
                        targetState:
                          type:
                            - string
                            - "null"
                          enum:
                            - solid
                            - review
                            - weak
                        justification:
                          type:
                            - string
                            - "null"
                        ref:
                          type: object
                          additionalProperties:
                            type: string
                      required:
                        - id
                        - at
                        - source
                        - correct
                        - responseFormat
                        - inferred
                        - weight
                        - confidence
                        - targetState
                        - justification
                        - ref
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 200
                        conceptId:
                          type:
                            - string
                            - "null"
                          minLength: 1
                          maxLength: 200
                        text:
                          type: string
                        origin:
                          type: string
                          enum:
                            - agent
                            - pwa
                            - lh
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - conceptId
                        - text
                        - origin
                        - createdAt
                  errors:

  /health:
    get:
      summary: Status of LH, eval, worker, jobs queue, last backup
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  lh:
                    type: object
                    properties:
                      reachable:
                        type: boolean
                      error:
                        type:
                          - string
                          - "null"
                      lastSyncAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                    required:
                      - reachable
                      - error
                      - lastSyncAt
                  eval:
                    type: object
                    properties:
                      reachable:
                        type: boolean
                      error:
                        type:
                          - string
                          - "null"
                    required:
                      - reachable
                      - error
                  worker:
                    type: object
                    properties:
                      alive:
                        type: boolean
                      lastHeartbeatAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                    required:
                      - alive
                      - lastHeartbeatAt
                  jobs:
                    type: object
                    properties:
                      queued:
                        type: integer
                        minimum: 0
                      running:
                        type: integer
                        minimum: 0
                      failed:
                        type: integer
                        minimum: 0
                      oldestQueuedAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                    required:
                      - queued
                      - running
                      - failed
                      - oldestQueuedAt
                  backup:
                    type: object
                    properties:
                      lastAt:
                        type:
                          - string
                          - "null"
                        format: date-time
                      lastOk:
                        type:
                          - boolean
                          - "null"
                      repoSizeBytes:
                        type:
                          - integer
                          - "null"
                        minimum: 0
                      sizeWarning:
                        type: boolean
                    required:
                      - lastAt
                      - lastOk
                      - repoSizeBytes
                      - sizeWarning
                  llm:
                    type: object
                    properties:
                      provider:
                        type: string
                        enum:
                          - claude-cli
                          - openai-compatible
                      cheapModel:
                        type: string
                      strongModel:
                        type: string
                      calls24h:
                        type: integer
                        minimum: 0
                      failed24h:
                        type: integer
                        minimum: 0
                    required:
                      - provider
                      - cheapModel
                      - strongModel
                      - calls24h
                      - failed24h
                  metrics:
                    type: object
                    properties:
                      questionsWithConceptPct:
                        type:
                          - number
                          - "null"
                        minimum: 0
                        maximum: 100
                    required:
                      - questionsWithConceptPct
                required:
                  - ok
                  - lh
                  - eval
                  - worker
                  - jobs
                  - backup
                  - llm
                  - metrics
